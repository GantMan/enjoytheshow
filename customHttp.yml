# Amplify Hosting response headers
customHeaders:
  # Vite fingerprints everything under /assets, so it can be cached forever
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '**/*.bin'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: '**/*.mp4'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
