version: 1
# Frontend-only build. The AppSync/DynamoDB backend (Amplify Gen 1 "prod" env)
# is already deployed and is no longer pushed from CI.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
